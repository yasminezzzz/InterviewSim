<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur d'entretien</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: url('https://www.investopedia.com/thmb/2FhTZblV83RR8iKmYMvVsl_1PDA=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/GettyImages-1011442304-753aa9168be547d78fede34155d1c3ba.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #1a2744;
            color: #1a2744;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 20, 40, 0.75);
            z-index: -1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.96);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 32px;
            color: #1a2744;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #6b7a99;
            font-size: 14px;
            margin-bottom: 30px;
            font-style: italic;
        }

        .row {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }

        select {
            padding: 10px 14px;
            font-size: 15px;
            border: 2px solid #d1d9e6;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: border 0.2s;
            flex: 1;
            max-width: 300px;
        }

        select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        button {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        #startBtn {
            background: linear-gradient(135deg, #10b981, #047857);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        #startBtn:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        #speakBtn {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        #recordBtn {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        #stopBtn {
            background: linear-gradient(135deg, #f59e0b, #b45309);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        #status {
            font-size: 15px;
            color: #1e40af;
            background: #dbeafe;
            padding: 12px 16px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-weight: 500;
            border-left: 4px solid #3b82f6;
        }

        #question {
            font-size: 22px;
            color: #1a2744;
            margin: 25px 0;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 5px solid #3b82f6;
            font-weight: 600;
            line-height: 1.5;
        }

        #question:empty {
            display: none;
        }

        #transcript {
            background: #f8fafc;
            padding: 16px 20px;
            border-radius: 12px;
            margin: 15px 0;
            min-height: 50px;
            font-size: 15px;
            color: #333;
            border: 2px dashed #cbd5e1;
            font-style: italic;
        }

        #score {
            font-size: 20px;
            color: #047857;
            margin: 15px 0;
            padding: 16px 20px;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border-radius: 12px;
            font-weight: 700;
            text-align: center;
            border: 2px solid #10b981;
        }

        #score:empty {
            display: none;
        }

        #history {
            margin: 30px 0;
        }

        #history .turn {
            background: #f8fafc;
            border-left: 5px solid #3b82f6;
            padding: 16px 20px;
            margin: 12px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s;
        }

        #history .turn:hover {
            transform: translateX(4px);
        }

        #history .turn .q {
            font-weight: 700;
            margin-bottom: 8px;
            color: #1a2744;
            font-size: 15px;
        }

        #history .turn .a {
            color: #475569;
            margin: 6px 0;
            font-size: 14px;
            font-style: italic;
        }

        #history .turn .s {
            color: #047857;
            font-size: 13px;
            margin-top: 8px;
            font-weight: 600;
        }

        #report {
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            padding: 24px;
            border-radius: 12px;
            margin-top: 24px;
            border: 2px solid #6366f1;
        }

        #report h2 {
            color: #3730a3;
            margin-bottom: 16px;
            font-size: 20px;
        }

        #report p {
            margin: 8px 0;
            font-size: 15px;
            color: #1a2744;
        }

        #report b {
            color: #4338ca;
            font-size: 17px;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 24px; }
            button { padding: 10px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎤 Simulateur d'entretien</h1>
    <p class="subtitle">Préparez vos entretiens avec un interviewer intelligent</p>

    <div class="row">
        <label for="profile">Poste :</label>
        <select id="profile">
            <option>Software Engineer</option>
            <option>Data Scientist</option>
            <option>QA Analyst</option>
        </select>
        <button id="startBtn">▶ Commencer</button>
    </div>

    <div id="status">En attente…</div>
    <div id="question"></div>

    <div class="row">
        <button id="speakBtn" disabled>🔊 Réécouter la question</button>
    </div>

    <div class="row">
        <button id="recordBtn" disabled>🎤 Parler</button>
        <button id="stopBtn" disabled>⏹ Stop</button>
    </div>

    <div id="transcript">(ta réponse apparaîtra ici)</div>
    <div id="score"></div>

    <div id="history"></div>

    <div id="report" style="display:none;"></div>

    <audio id="player"></audio>
</div>

<script src="/app.js"></script>
</body>
</html>
